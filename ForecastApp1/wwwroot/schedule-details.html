<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Детализация — ForecastApp1</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <script src="/lib/jquery/dist/jquery.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="/js/api.js"></script>
  <script>document.write(layoutHeader('schedule.html'));</script>
  <main role="main" class="container pb-3">
    <h1 class="mb-3">Детализация строки графика</h1>
    <p><a href="schedule.html" id="back">← К графику</a></p>
    <div class="card box-shadow">
      <div class="card-body" id="box">Загрузка…</div>
    </div>
  </main>
  <script>document.write(layoutFooter());</script>
  <script>
    var qs = new URLSearchParams(location.search);
    var runId = qs.get('runId');
    var itemId = qs.get('itemId');
    document.getElementById('back').href = 'schedule.html' + (runId ? '?runId=' + runId : '');
    (async function () {
      try {
        var d = await api('/api/calculations/' + runId + '/schedule/' + itemId + '/details');
        var i = d.item;
        document.getElementById('box').innerHTML =
          '<table class="table table-bordered table-sm"><tbody>' +
          '<tr><th class="w-25">Прогнозная дата</th><td>' +
          fmtDate(i.forecastPaymentDate) +
          '</td></tr>' +
          '<tr><th>Сумма к оплате</th><td>' +
          fmtMoney(i.payAmount) +
          '</td></tr>' +
          '<tr><th>Дата по условию</th><td>' +
          fmtDate(d.dueByCondition) +
          '</td></tr>' +
          '<tr><th>Отсрочка (дн.)</th><td>' +
          d.delayDays +
          '</td></tr>' +
          '<tr><th>Перенос выходного</th><td>' +
          (d.weekendShift ? 'да' : 'нет') +
          '</td></tr>' +
          '<tr><th>Поднято до даты расчёта</th><td>' +
          (d.raisedToCalcDate ? 'да' : 'нет') +
          '</td></tr>' +
          '<tr><th>Просрочка (условие &lt; дата расчёта)</th><td>' +
          (d.overdue ? 'да' : 'нет') +
          '</td></tr>' +
          '<tr><th>Снимок долга</th><td>#' +
          d.debtSnapshotId +
          ' от ' +
          fmtDate(d.debtDate) +
          ', сумма ' +
          fmtMoney(d.debtAmount) +
          '</td></tr>' +
          '<tr><th>Распределено из долга</th><td>' +
          fmtMoney(d.allocatedAmount) +
          '</td></tr>' +
          '<tr><th>Отгрузка</th><td>#' +
          d.shipmentId +
          ', всего ' +
          fmtMoney(d.shipmentTotal) +
          '</td></tr>' +
          '<tr><th>Условие (id)</th><td>' +
          (d.conditionId ?? '—') +
          '</td></tr>' +
          '<tr><th>Предупреждение</th><td>' +
          (d.warning || '—') +
          '</td></tr>' +
          '</tbody></table>';
      } catch (e) {
        document.getElementById('box').innerHTML = '<div class="alert alert-danger">' + e.message + '</div>';
      }
    })();
  </script>
</body>
</html>
