<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отгрузки — ForecastApp1</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <script src="/lib/jquery/dist/jquery.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="/js/api.js"></script>
  <script>document.write(layoutHeader('shipments.html'));</script>
  <main role="main" class="container pb-3">
    <h1 class="mb-3">Фактические отгрузки</h1>
    <div class="card box-shadow mb-3">
      <div class="card-body row g-2 align-items-end">
        <div class="col-sm-4 col-md-3">
          <label class="form-label">supplierId</label>
          <input class="form-control" id="sid" type="number" />
        </div>
        <div class="col-sm-4 col-md-3">
          <label class="form-label">contractId</label>
          <input class="form-control" id="cid" type="number" />
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-primary" id="go">Показать</button>
        </div>
      </div>
    </div>
    <div class="card box-shadow">
      <div class="card-body table-responsive"><div id="tbl"></div></div>
    </div>
  </main>
  <script>document.write(layoutFooter());</script>
  <script>
    async function load() {
      var p = [];
      if (sid.value) p.push('supplierId=' + sid.value);
      if (cid.value) p.push('contractId=' + cid.value);
      var rows = await api('/api/shipments?' + p.join('&'));
      document.getElementById('tbl').innerHTML =
        '<table class="table table-striped table-sm"><thead><tr><th>Дата док.</th><th>Номер</th><th>Заказ</th><th>Сумма</th><th>Поставщик</th><th>Договор</th></tr></thead><tbody>' +
        rows
          .map(function (r) {
            return (
              '<tr><td>' +
              fmtDate(r.shipmentDocDate) +
              '</td><td>' +
              r.shipmentDocNumber +
              '</td><td>' +
              (r.orderNumber || '') +
              '</td><td>' +
              fmtMoney(r.shipmentAmount) +
              '</td><td>' +
              r.supplierCode +
              '</td><td>' +
              r.contract +
              '</td></tr>'
            );
          })
          .join('') +
        '</tbody></table>';
    }
    var sid = document.getElementById('sid');
    var cid = document.getElementById('cid');
    document.getElementById('go').onclick = function () {
      load().catch(function (e) {
        alert(e.message);
      });
    };
    load().catch(function (e) {
      alert(e.message);
    });
  </script>
</body>
</html>
