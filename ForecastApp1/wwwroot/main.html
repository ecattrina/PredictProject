<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная — ForecastApp1</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <script src="/lib/jquery/dist/jquery.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="/js/api.js?v=20260505"></script>
  <script>document.write(layoutHeader('main.html'));</script>
  <main role="main" class="container pb-3">
    <h1 class="mb-3">Главное меню</h1>
    <div class="card box-shadow mb-3">
      <div class="card-body" id="me">Загрузка…</div>
    </div>
    <div class="card box-shadow">
      <div class="card-body">
        <p class="mb-0">
          Перейдите по пунктам меню: импорт Excel, справочники, расчёт графика и отчёты.
          Подробная <a href="help.html">инструкция и требования к файлу импорта</a>.
        </p>
      </div>
    </div>
  </main>
  <script>document.write(layoutFooter());</script>
  <script>
    (async function () {
      try {
        var u = await api('/api/auth/me');
        document.getElementById('me').innerHTML =
          '<strong>' +
          (u.email || '') +
          '</strong><br /><span class="text-muted">Роли: ' +
          (u.roles || []).join(', ') +
          '</span>';
      } catch (e) {
        document.getElementById('me').textContent = e.message;
      }
    })();
  </script>
</body>
</html>
