<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Справочники</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #262626;
            line-height: 1.6;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            color: #171717;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        header h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 600;
            color: #171717;
            letter-spacing: -0.025em;
        }

        .back-button {
            background-color: #3939FF;
            color: white;
            padding: 0.75rem 1.5rem;
            border: 1px solid #3939FF;
            border-radius: 0.5rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 150ms ease-in-out;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .back-button:hover {
            background-color: #2d2dcc;
            border-color: #2d2dcc;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        button {
            background-color: #D3FF33;
            color: #171717;
            padding: 0.75rem 1.5rem;
            border: 1px solid #D3FF33;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 150ms ease-in-out;
            min-height: 44px;
        }

        button:hover {
            background-color: #c2e62a;
            border-color: #c2e62a;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: #171717;
            letter-spacing: -0.025em;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: end;
        }

        .form-group input {
            padding: 0.75rem 1rem;
            border: 1px solid #d4d4d4;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #262626;
            transition: all 150ms ease-in-out;
            min-height: 44px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3939FF;
            box-shadow: 0 0 0 3px rgba(57, 57, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #a3a3a3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: white;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f5f5f5;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background-color: #fafafa;
            color: #525252;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #fafafa;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn-edit {
            background-color: #AEE6ED;
            color: #171717;
            padding: 0.5rem 1rem;
            border: 1px solid #AEE6ED;
            border-radius: 0.375rem;
            cursor: pointer;
            margin-right: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 150ms ease-in-out;
        }

        .btn-edit:hover {
            background-color: #9dd9e0;
            border-color: #9dd9e0;
            transform: translateY(-1px);
        }

        .btn-delete {
            background-color: #FF5B22;
            color: white;
            padding: 0.5rem 1rem;
            border: 1px solid #FF5B22;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 150ms ease-in-out;
        }

        .btn-delete:hover {
            background-color: #e54a1a;
            border-color: #e54a1a;
            transform: translateY(-1px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e5e5;
            animation: slideDown 0.3s ease;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #171717;
        }

        .modal-content input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #d4d4d4;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #262626;
            transition: all 150ms ease-in-out;
            min-height: 44px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #3939FF;
            box-shadow: 0 0 0 3px rgba(57, 57, 255, 0.1);
        }

        .modal-content button {
            padding: 0.75rem 1.5rem;
            margin-right: 0.5rem;
            border: 1px solid;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 150ms ease-in-out;
            min-height: 44px;
        }

        .modal-content button:first-of-type {
            background-color: #D3FF33;
            color: #171717;
            border-color: #D3FF33;
        }

        .modal-content button:first-of-type:hover {
            background-color: #c2e62a;
            border-color: #c2e62a;
            transform: translateY(-1px);
        }

        .modal-content button:last-of-type {
            background-color: #FF5B22;
            color: white;
            border-color: #FF5B22;
        }

        .modal-content button:last-of-type:hover {
            background-color: #e54a1a;
            border-color: #e54a1a;
            transform: translateY(-1px);
        }

        .status {
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            margin: 1rem 0;
            border: 1px solid;
        }

        .success {
            background-color: rgba(211, 255, 51, 0.1);
            color: #8b9a1a;
            border-color: rgba(211, 255, 51, 0.3);
        }

        .error {
            background-color: rgba(255, 91, 34, 0.1);
            color: #cc4a1a;
            border-color: rgba(255, 91, 34, 0.3);
        }

        @keyframes fadeIn {
            from {
                background: rgba(0,0,0,0);
            }
            to {
                background: rgba(0,0,0,0.5);
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        hr {
            margin: 2rem 0;
            border: none;
            border-top: 1px solid #e5e5e5;
        }
    </style>
</head>
<body>
    <header>
        <h1>Справочники</h1>
        <a href="/main.html" class="back-button">← Назад</a>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="excelFile">Выберите Excel-файл (.xlsx):</label>
            <input type="file" id="excelFile" accept=".xlsx" />
        </div>
        <button onclick="upload()">Импортировать</button>
        <div id="status" class="status"></div>

        <hr>
        <!-- Поставщики -->
        <h2>Поставщики</h2>
        <div class="form-group">
            <input id="supplierCode" type="text" placeholder="Код поставщика">
            <input id="supplierName" type="text" placeholder="Название">
            <button onclick="addSupplier()">Сохранить</button>
        </div>
        <table id="suppliersTable">
            <thead>
                <tr>
                    <th>Код</th>
                    <th>Название</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Договоры -->
        <h2>Договоры с поставщиками</h2>
        <div class="form-group">
            <input id="contractInternal" type="text" placeholder="Код договора">
            <input id="contractSupplier" type="text" placeholder="Код поставщика">
            <input id="contractExternal" type="text" placeholder="Внешний номер договора">
            <input id="contractDate" type="date">
            <button onclick="addContract()">Сохранить</button>
        </div>
        <table id="contractsTable">
            <thead>
                <tr>
                    <th>Номер</th>
                    <th>Поставщик</th>
                    <th>Внешний №</th>
                    <th>Дата</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Условия договора -->
        <h2>Условия договора</h2>
        <div class="form-group">
            <input id="conditionContract" type="text" placeholder="Внутренний номер договора">
            <input id="conditionMonth" type="month" placeholder="Месяц">
            <input id="conditionDelay" type="number" placeholder="Отсрочка оплаты (дни)">
            <button onclick="addCondition()">Сохранить</button>
        </div>
        <table id="conditionsTable">
            <thead>
                <tr>
                    <th>Договор</th>
                    <th>Месяц</th>
                    <th>Отсрочка</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Модальное окно -->
        <div class="modal" id="editModal">
            <div class="modal-content">
                <h3 id="modalTitle">Редактирование</h3>
                <div id="modalFields"></div>
                <button type="button" onclick="saveEdit()">Сохранить</button>
                <button onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = "/api";
        async function upload() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            const status = document.getElementById('status');
            status.textContent = '';
            status.className = 'status';

            if (!file) {
                status.textContent = 'Пожалуйста, выберите файл.';
                status.classList.add('error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('https://localhost:7052/api/ImportSpravochniki/excel', {
                    method: 'POST',
                    body: formData,
                    credentials: "include"
                });

                if (response.status === 401) {
                    location.href = "logins.html";
                    return;
                }

                if (response.ok) {
                    const result = await response.text();
                    status.textContent = 'Импорт успешно завершён.';
                    status.classList.add('success');
                } else {
                    const error = await response.text();
                    status.textContent = `Ошибка: ${error}`;
                    status.classList.add('error');
                }
            } catch (err) {
                console.error('Fetch error:', err);
                status.textContent = `Ошибка запроса: ${err.message}`;
                status.classList.add('error');
            }
        }
        // --- Поставщики ---
        async function loadSuppliers() {
            const res = await fetch(`${apiBase}/suppliers`);
            const data = await res.json();
            const tbody = document.querySelector("#suppliersTable tbody");
            tbody.innerHTML = "";
            data.forEach(s => {
                const row = `<tr>
                    <td>${s.supplier_code}</td>
                    <td>${s.supplier_name}</td>
                    <td>
                      <button class="btn-edit"data-code="${s.supplier_code}"data-name="${escapeHtml(s.supplier_name)}"onclick="editSupplierFromButton(this)">Редактировать</button>
                      <button class="btn-delete" onclick="deleteSupplier('${s.supplier_code}')">Удалить</button>
                    </td></tr>`;
                tbody.innerHTML += row;
            });
        }

        async function addSupplier() {
            const code = document.getElementById("supplierCode").value;
            const name = document.getElementById("supplierName").value;
            await fetch(`${apiBase}/suppliers`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ supplierCode: code, supplierName: name })
            });
            await loadSuppliers();
        }

        async function deleteSupplier(code) {
            await fetch(`${apiBase}/suppliers/${code}`, { method: "DELETE" });
            await loadSuppliers();
        }
        function editSupplierFromButton(btn) {
            const code = btn.dataset.code;
            const name = btn.dataset.name;
            editSupplier(code, name); // вызываем вашу существующую функцию
        }
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
        function editSupplier(code, name) {
            editContext = { type: "supplier", key: code, data: { name } };
            document.getElementById("modalTitle").innerText = "Редактирование поставщика";

            const modalFields = document.getElementById("modalFields");
            modalFields.innerHTML = ""; // очищаем

            const input = document.createElement("input");
            input.id = "editName";
            input.type = "text";
            input.value = name; // безопасно
            input.placeholder = "Название";
            modalFields.appendChild(input);

            openModal();
        }

        // --- Договоры ---
        async function loadContracts() {
            const res = await fetch(`${apiBase}/contracts/GetAll`);
            const data = await res.json();
            const tbody = document.querySelector("#contractsTable tbody");
            tbody.innerHTML = "";
            data.forEach(c => {
                const row = `<tr>
                    <td>${c.internalContractNumber}</td>
                    <td>${c.supplierCode}</td>
                    <td>${c.externalContractNumber}</td>
                    <td>${c.contractDate.split('T')[0]}</td>
                    <td>
                      <button class="btn-edit"data-internal="${c.internalContractNumber}"data-supplier="${c.supplierCode}"data-external="${c.externalContractNumber}"data-date="${c.contractDate.split('T')[0]}"onclick="editContractFromButton(this)">Редактировать</button>
                      <button class="btn-delete" onclick="deleteContract('${c.internalContractNumber}')">Удалить</button>
                    </td></tr>`;
                tbody.innerHTML += row;
            });
        }

        async function addContract() {
            const dto = {
                externalContractNumber: document.getElementById("contractExternal").value,
                supplierCode: document.getElementById("contractSupplier").value,
                internalContractNumber: document.getElementById("contractInternal").value,
                contractDate: document.getElementById("contractDate").value
            };
            await fetch(`${apiBase}/contracts/Add`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dto)
            });
            await loadContracts();
        }

        async function deleteContract(internalNumber) {
            await fetch(`${apiBase}/contracts/Delete/${internalNumber}`, { method: "DELETE" });
            await loadContracts();
        }

        function editContract(internal, supplier, external, date) {
            editContext = { type: "contract", key: internal };
            document.getElementById("modalTitle").innerText = "Редактирование договора";

            const modalFields = document.getElementById("modalFields");
            modalFields.innerHTML = ""; // очищаем

            const inputSupplier = document.createElement("input");
            inputSupplier.id = "editSupplier";
            inputSupplier.type = "text";
            inputSupplier.value = supplier;
            inputSupplier.placeholder = "Код поставщика";

            const inputExternal = document.createElement("input");
            inputExternal.id = "editExternal";
            inputExternal.type = "text";
            inputExternal.value = external;
            inputExternal.placeholder = "Внешний номер договора";

            const inputDate = document.createElement("input");
            inputDate.id = "editDate";
            inputDate.type = "date";
            inputDate.value = date;

            modalFields.appendChild(inputSupplier);
            modalFields.appendChild(inputExternal);
            modalFields.appendChild(inputDate);

            openModal();
        }
        function editContractFromButton(btn) {
            const internal = btn.dataset.internal;
            const supplier = btn.dataset.supplier;
            const external = btn.dataset.external;
            const date = btn.dataset.date;
            editContract(internal, supplier, external, date);
        }
        // --- Условия ---
        async function loadConditions() {
            const res = await fetch(`${apiBase}/conditions/GetAll`);
            const data = await res.json();
            const tbody = document.querySelector("#conditionsTable tbody");
            tbody.innerHTML = "";
            data.forEach(c => {
                const row = `<tr>
                    <td>${c.internalContractNumber}</td>
                    <td>${c.orderMonth}</td>
                    <td>${c.paymentDelayDays}</td>
                    <td>
                      <button class="btn-edit"data-num="${c.internalContractNumber}"data-month="${c.orderMonth}"data-delay="${c.paymentDelayDays}"onclick="editConditionFromButton(this)">Редактировать</button>
                      <button class="btn-delete" onclick="deleteCondition('${c.internalContractNumber}','${c.orderMonth}')">Удалить</button>
                    </td></tr>`;
                tbody.innerHTML += row;
            });
        }

        async function addCondition() {
            const dto = {
                internalContractNumber: document.getElementById("conditionContract").value,
                orderMonth: document.getElementById("conditionMonth").value,
                paymentDelayDays: parseInt(document.getElementById("conditionDelay").value)
            };
            await fetch(`${apiBase}/conditions/Add`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dto)
            });
            await loadConditions();
        }

        async function deleteCondition(num, month) {
            await fetch(`${apiBase}/conditions/Delete/${num}/${month}`, { method: "DELETE" });
            await loadConditions();
        }

        function editCondition(num, month, delay) {
            editContext = { type: "condition", key: { internalNumber: num, orderMonth: month } };
            document.getElementById("modalTitle").innerText = "Редактирование условия";

            const modalFields = document.getElementById("modalFields");
            modalFields.innerHTML = ""; // очищаем

            const input = document.createElement("input");
            input.id = "editDelay";
            input.type = "number";
            input.value = delay; // безопасно
            input.placeholder = "Отсрочка (дни)";
            modalFields.appendChild(input);

            openModal();
        }
        function editConditionFromButton(btn) {
            const num = btn.dataset.num;
            const month = btn.dataset.month;
            const delay = btn.dataset.delay;
            editCondition(num, month, delay);
        }

        function openModal() { document.getElementById("editModal").style.display = "flex"; }
        function closeModal() { document.getElementById("editModal").style.display = "none"; editContext = null; }
        async function saveEdit() {
            if (!editContext) return;

            // --- Редактирование поставщика ---
            if (editContext.type === "supplier") {
                const nameInput = document.getElementById("editName");
                if (!nameInput) return;
                const name = nameInput.value.trim();
                if (!name) {
                    alert("Название не может быть пустым.");
                    return;
                }

                await fetch(`/api/suppliers/${editContext.key}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        SupplierCode: editContext.key,
                        SupplierName: name
                    })
                });

                await loadSuppliers();
            }
            // --- Редактирование условия договора ---
            else if (editContext.type === "condition") {
                const delayInput = document.getElementById("editDelay");
                if (!delayInput) return;
                const delay = parseInt(delayInput.value);
                if (isNaN(delay)) {
                    alert("Задержка должна быть числом.");
                    return;
                }

                await fetch(`/api/conditions/${editContext.key.internalNumber}/${editContext.key.orderMonth}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        internalContractNumber: editContext.key.internalNumber,
                        orderMonth: editContext.key.orderMonth,
                        paymentDelayDays: delay
                    })
                });

                await loadConditions();
            }
            else if (editContext.type === "contract") {
                const supplierCode = document.getElementById("editSupplier").value.trim();
                const externalNum = document.getElementById("editExternal").value.trim();
                const date = document.getElementById("editDate").value;

                if (!supplierCode || !externalNum || !date) {
                    alert("Все поля должны быть заполнены.");
                    return;
                }

                await fetch(`/api/contracts/${editContext.key}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        internalContractNumber: editContext.key,
                        supplierCode,
                        externalContractNumber: externalNum,
                        contractDate: date
                    })
                });

                await loadContracts();
            }
            closeModal();
        }
        // --- Первичная загрузка ---
        loadSuppliers();
        loadContracts();
        loadConditions();
    </script>
</body>
</html>
