<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расчёт — ForecastApp1</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <script src="/lib/jquery/dist/jquery.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="/js/api.js"></script>
  <script>document.write(layoutHeader('calculation.html'));</script>
  <main role="main" class="container pb-3">
    <h1 class="mb-3">Запуск расчёта графика</h1>
    <div id="msg" class="alert" style="display: none" role="alert"></div>
    <div class="card box-shadow mb-3">
      <div class="card-body row g-2 align-items-end">
        <div class="col-sm-4 col-md-3">
          <label class="form-label">Дата расчёта</label>
          <input class="form-control" id="d" type="date" />
        </div>
        <div class="col-sm-4 col-md-3">
          <label class="form-label">Поставщик (опц.)</label>
          <input class="form-control" id="sid" type="text" inputmode="numeric" placeholder="id или код, напр. 10001" />
        </div>
        <div class="col-sm-4 col-md-3">
          <label class="form-label">Договор (опц.)</label>
          <input class="form-control" id="cid" type="text" inputmode="numeric" placeholder="id или номер, напр. 245" />
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-primary" id="run">Запустить</button>
        </div>
      </div>
    </div>
    <div class="card box-shadow">
      <div class="card-body">
        <h2 class="h5 card-title">История расчётов</h2>
        <div class="table-responsive"><div id="runs"></div></div>
      </div>
    </div>
  </main>
  <script>document.write(layoutFooter());</script>
  <script>
    document.getElementById('d').valueAsDate = new Date();
    function show(t, kind) {
      var m = document.getElementById('msg');
      m.textContent = t || '';
      m.style.display = t ? 'block' : 'none';
      m.className =
        'alert alert-' + (kind === 'ok' ? 'success' : kind === 'info' ? 'info' : 'danger');
    }
    async function loadRuns() {
      var r = await api('/api/calculations');
      document.getElementById('runs').innerHTML =
        '<table class="table table-striped table-sm"><thead><tr><th>ID</th><th>Дата</th><th>Статус</th><th></th></tr></thead><tbody>' +
        r
          .map(function (x) {
            return (
              '<tr><td>' +
              x.id +
              '</td><td>' +
              fmtDate(x.calculationDate) +
              '</td><td>' +
              x.status +
              '</td><td class="table-actions"><a href="reports.html">Отчёты</a> · <a href="schedule.html?runId=' +
              x.id +
              '">Таблица</a></td></tr>'
            );
          })
          .join('') +
        '</tbody></table>';
    }
    document.getElementById('run').onclick = async function () {
      try {
        var body = { calculationDate: document.getElementById('d').value, calendarCode: 'default' };
        var sid = document.getElementById('sid').value.trim();
        var cid = document.getElementById('cid').value.trim();
        if (sid) body.supplierId = Number(sid);
        if (cid) body.contractId = Number(cid);
        var res = await api('/api/calculations/run', { method: 'POST', body: body });
        localStorage.setItem('lastRunId', res.runId);
        show('Создан расчёт #' + res.runId, 'ok');
        location.href = 'reports.html';
      } catch (e) {
        show(e.message, 'err');
      }
    };
    loadRuns().catch(function (e) {
      show(e.message, 'err');
    });
  </script>
</body>
</html>
