<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аудит — ForecastApp1</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <script src="/lib/jquery/dist/jquery.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="/js/api.js?v=20260505"></script>
  <script>document.write(layoutHeader('audit.html'));</script>
  <main role="main" class="container pb-3">
    <h1 class="mb-3">Журнал аудита</h1>
    <div id="msg" class="alert alert-danger" style="display: none" role="alert"></div>
    <div class="card box-shadow">
      <div class="card-body table-responsive"><div id="tbl">…</div></div>
    </div>
  </main>
  <script>document.write(layoutFooter());</script>
  <script>
    (async function () {
      try {
        var rows = await api('/api/audit?take=300');
        document.getElementById('tbl').innerHTML =
          '<table class="table table-sm table-striped"><thead><tr><th>Время</th><th>Действие</th><th>Пользователь</th><th>Сущность</th><th>Batch</th><th>Run</th></tr></thead><tbody>' +
          rows
            .map(function (a) {
              return (
                '<tr><td>' +
                a.occurredAt +
                '</td><td>' +
                a.action +
                '</td><td>' +
                (a.userId ?? '') +
                '</td><td>' +
                (a.entityType || '') +
                ' ' +
                (a.entityId || '') +
                '</td><td>' +
                (a.importBatchId ?? '') +
                '</td><td>' +
                (a.calculationRunId ?? '') +
                '</td></tr>'
              );
            })
            .join('') +
          '</tbody></table>';
      } catch (e) {
        var m = document.getElementById('msg');
        m.style.display = 'block';
        m.textContent = e.message;
      }
    })();
  </script>
</body>
</html>
