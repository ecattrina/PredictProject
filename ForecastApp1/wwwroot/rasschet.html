<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>График платежей</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #262626;
            line-height: 1.6;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            color: #171717;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        header h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 600;
            color: #171717;
            letter-spacing: -0.025em;
        }

        .back-button {
            background-color: #3939FF;
            color: white;
            padding: 0.75rem 1.5rem;
            border: 1px solid #3939FF;
            border-radius: 0.5rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 150ms ease-in-out;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .back-button:hover {
            background-color: #2d2dcc;
            border-color: #2d2dcc;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #e5e5e5;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .search-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: end;
        }

        .search-group select,
        .search-group input {
            padding: 0.75rem 1rem;
            border: 1px solid #d4d4d4;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #262626;
            transition: all 150ms ease-in-out;
            min-height: 44px;
        }

        .search-group select:focus,
        .search-group input:focus {
            outline: none;
            border-color: #3939FF;
            box-shadow: 0 0 0 3px rgba(57, 57, 255, 0.1);
        }

        .search-group input::placeholder {
            color: #a3a3a3;
        }

        button {
            background-color: #D3FF33;
            color: #171717;
            padding: 0.75rem 1.5rem;
            border: 1px solid #D3FF33;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 150ms ease-in-out;
            min-height: 44px;
        }

        button:hover {
            background-color: #c2e62a;
            border-color: #c2e62a;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: white;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f5f5f5;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background-color: #fafafa;
            color: #525252;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #fafafa;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .error {
            color: #cc4a1a;
            margin-top: 1rem;
            font-weight: 500;
            padding: 1rem 1.5rem;
            background-color: rgba(255, 91, 34, 0.1);
            border: 1px solid rgba(255, 91, 34, 0.3);
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>График платежей</h1>
        <a href="/main.html" class="back-button">← Назад</a>
    </header>

    <div class="container">
        <div class="search-group">
            <select id="searchType">
                <option value="all">Все записи</option>
                <option value="contract">По договору</option>
                <option value="supplier">По поставщику</option>
            </select>
            <input type="text" id="searchValue" placeholder="Введите значение..." />
            <button onclick="loadData()">Найти</button>
        </div>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>Код поставщика</th>
                    <th>Код договора</th>
                    <th>Номер заказа</th>
                    <th>Номер документа отгрузки</th>
                    <th>Дата документа отгрузки</th>
                    <th>Сумма отгрзуки, руб.</th>
                    <th>Дата платежа по условию</th>
                    <th>Прогнозная дата платежа</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="error" class="error"></div>
    </div>

    <script>
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU');
        }

        function formatAmount(amount) {
            if (typeof amount !== 'number') return '-';
            return amount.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function loadData() {
            const type = document.getElementById("searchType").value;
            const value = document.getElementById("searchValue").value.trim();
            const errorDiv = document.getElementById("error");
            const tbody = document.querySelector("#dataTable tbody");

            errorDiv.textContent = "";
            tbody.innerHTML = "";

            let url = "https://localhost:7052/api/paymentschedule/all";

            if (type === "contract" && value) {
                url = `https://localhost:7052/api/paymentschedule/by-contract/${value}`;
            } else if (type === "supplier" && value) {
                url = `https://localhost:7052/api/paymentschedule/by-supplier/${value}`;
            }

            try {
                const response = await fetch(url, { credentials: "include" });

                if (response.status === 401) {
                    location.href = "logins.html";
                    return;
                }

                const data = await response.json();
                if (data.length === 0) {
                    errorDiv.textContent = "Данные не найдены.";
                    return;
                }

                data.forEach(item => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${item.supplierCode}</td>
                        <td>${item.internalContractNumber ?? '-'}</td>
                        <td>${item.orderNumber ?? '-'}</td>
                        <td>${item.shipmentDocNumber ?? '-'}</td>
                        <td>${formatDate(item.shipmentDocDate)}</td>
                        <td>${formatAmount(item.totalAmount)}</td>
                        <td>${formatDate(item.paymentDateByCondition)}</td>
                        <td>${formatDate(item.paymentDate)}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                errorDiv.textContent = err.message;
            }
        }

        // загрузка всех данных при открытии страницы
        loadData();
    </script>
</body>
</html>
