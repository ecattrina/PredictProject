<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Импорт — ForecastApp1</title>
  <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <script src="/lib/jquery/dist/jquery.js"></script>
  <script src="/lib/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="/js/api.js?v=20260505"></script>
  <script>document.write(layoutHeader('import.html'));</script>
  <main role="main" class="container pb-3">
    <h1 class="mb-3">Импорт Excel</h1>
    <p class="small text-muted mb-3"><a href="help.html#import-file">Требования к файлу и формату</a> — в справке.</p>
    <div id="msg" class="alert" style="display: none" role="alert"></div>
    <div class="card box-shadow mb-3">
      <div class="card-body">
        <h2 class="h5 card-title">Загрузка файла</h2>
        <label class="form-label">Файл .xlsx</label>
        <input class="form-control mb-3" type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
        <button type="button" class="btn btn-primary" id="upload">Загрузить и разобрать</button>
      </div>
    </div>
    <div class="card box-shadow">
      <div class="card-body">
        <h2 class="h5 card-title">Последние пакеты</h2>
        <div class="table-responsive"><div id="list">…</div></div>
      </div>
    </div>
  </main>
  <script>document.write(layoutFooter());</script>
  <script>
    function show(msg, kind) {
      var el = document.getElementById('msg');
      el.className = 'alert alert-' + (kind === 'ok' ? 'success' : kind === 'err' ? 'danger' : 'info');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }
    async function refresh() {
      var rows = await api('/api/imports');
      document.getElementById('list').innerHTML =
        '<table class="table table-striped table-sm"><thead><tr><th>ID</th><th>Файл</th><th>Статус</th><th>Строк</th><th></th></tr></thead><tbody>' +
        rows
          .map(function (r) {
            return (
              '<tr><td>' +
              r.id +
              '</td><td>' +
              r.fileName +
              '</td><td>' +
              r.status +
              '</td><td>' +
              (r.rowCount ?? '') +
              '</td><td class="table-actions"><a href="import-preview.html?id=' +
              r.id +
              '">Открыть</a></td></tr>'
            );
          })
          .join('') +
        '</tbody></table>';
    }
    document.getElementById('upload').onclick = async function () {
      var f = document.getElementById('file').files[0];
      if (!f) {
        show('Выберите файл', 'err');
        return;
      }
      show('Загрузка…', 'info');
      try {
        var fd = new FormData();
        fd.append('file', f);
        var res = await fetch('/api/imports/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
        var text = await res.text();
        var data = text ? JSON.parse(text) : {};
        if (!res.ok) throw new Error(data.message || text);
        show('Пакет #' + data.batchId + ', статус: ' + data.status, 'ok');
        await refresh();
        location.href = 'import-preview.html?id=' + data.batchId;
      } catch (e) {
        show(e.message, 'err');
      }
    };
    refresh().catch(function (e) {
      show(e.message, 'err');
    });
  </script>
</body>
</html>
