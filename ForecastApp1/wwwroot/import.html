<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Импорт данных</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            header h1 {
                margin: 0;
                font-size: 1.5rem;
            }

        .back-button {
            background: #3498db;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        input[type="file"] {
            padding: 0.5rem;
            font-size: 1rem;
        }

        button {
            background: #27ae60;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .status {
            margin-top: 1rem;
            font-weight: bold;
        }

        .success {
            color: #27ae60;
        }

        .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <header>
        <h1>Импорт данных</h1>
        <a href="/index.html" class="back-button">← Назад</a>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="excelFile">Выберите Excel-файл (.xlsx):</label><br>
            <input type="file" id="excelFile" accept=".xlsx" />
        </div>

        <button onclick="upload()">Импортировать</button>

        <div id="status" class="status"></div>
    </div>

    <script>
        async function upload() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            const status = document.getElementById('status');
            status.textContent = '';
            status.className = 'status';

            if (!file) {
                status.textContent = 'Пожалуйста, выберите файл.';
                status.classList.add('error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file); // ключ 'file' строго как в Postman

            try {
                const response = await fetch('/api/import/excel', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        // Нельзя вручную задавать Content-Type для FormData!
                        // 'Content-Type': 'multipart/form-data' — УДАЛЕН
                    }
                });

                if (response.ok) {
                    const result = await response.text();
                    status.textContent = 'Импорт успешно завершён.';
                    status.classList.add('success');
                } else {
                    const error = await response.text();
                    status.textContent = `Ошибка: ${error}`;
                    status.classList.add('error');
                }
            } catch (err) {
                status.textContent = `Ошибка запроса: ${err}`;
                status.classList.add('error');
            }
        }
    </script>
</body>
</html>
