<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>График платежей</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            header h1 {
                margin: 0;
                font-size: 1.5rem;
            }

        .import-button {
            background: #3498db;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

            .form-group input[type="date"] {
                padding: 0.5rem;
                font-size: 1rem;
            }

            .form-group button {
                background: #27ae60;
                color: white;
                padding: 0.5rem 1rem;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e1e1e1;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: #f0f0f0;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .highlight-past {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>График платежей</h1>
        <!--<a href="/import.html" class="import-button">Импорт данных</a>-->
    </header>

    <div class="container">
        <div class="form-group">
            <label for="calc-date">Дата расчета:</label>
            <input type="date" id="calc-date" />
            <button onclick="calculate()">Рассчитать</button>
        </div>

        <table id="payments-table" style="display:none;">
            <thead>
                <tr>
                    <th>Код поставщика</th>
                    <th>Код договора</th>
                    <th>Номер заказа</th>
                    <th>Номер документа отгрузки</th>
                    <th>Дата документа отгрузки</th>
                    <th>Сумма отгрзуки, руб.</th>
                    <th>Дата платежа по условию</th>
                    <th>Прогнозная дата платежа</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU');
        }

        function formatAmount(amount) {
            if (typeof amount !== 'number') return '-';
            return amount.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
  async function calculate() {
    const date = document.getElementById('calc-date').value;
    if (!date) {
      alert('Выберите дату расчета');
      return;
    }

    const response = await fetch(`/api/payments/schedule?startDate=${date}`);
    const data = await response.json();

    const table = document.getElementById('payments-table');
    const tbody = table.querySelector('tbody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      table.style.display = 'none';
      alert('Нет данных на выбранную дату.');
      return;
    }

    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.supplierCode}</td>
        <td>${item.internalContractNumber ?? '-'}</td>
        <td>${item.orderNumber ?? '-'}</td>
        <td>${item.shipmentDocNumber ?? '-'}</td>
        <td>${formatDate(item.shipmentDocDate)}</td>
        <td>${formatAmount(item.totalAmount)}</td>
        <td>${formatDate(item.paymentDateByCondition)}</td>
        <td>${formatDate(item.paymentDate)}</td>
      `;
      tbody.appendChild(tr);
    });

    table.style.display = '';
  }
    </script>

</body>
</html>
